<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Центр управления синхронизацией 42 iPad</title>
  
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Sticky Header & Master Control Bar -->
  <header class="header-container">
    <div class="top-bar">
      <div class="brand-area">
        <h1 class="brand-title">🎬 42 iPad Sync Master</h1>
        <div class="server-ip-badge">
          <span>Адрес для подключения iPad: </span>
          <span id="serverIpList"><code>Загрузка...</code></span>
        </div>
      </div>
      <div id="serverConnectionStatus" class="status-tag offline">Подключение...</div>
    </div>

    <!-- Telemetry Stats Strip -->
    <div class="stats-strip">
      <div class="stat-box">
        <span class="stat-label">Подключено iPad</span>
        <span id="statConnected" class="stat-value">0 / 42</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">На взводе (Armed)</span>
        <span id="statArmed" class="stat-value">0 / 42</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">Видео загружено</span>
        <span id="statLoaded" class="stat-value">0 / 42</span>
      </div>

      <div class="stat-box">
        <span class="stat-label">Макс. рассинхрон</span>
        <span id="statMaxDrift" class="stat-value" style="color: #52c41a;">0 мс</span>
      </div>

      <div style="margin-left: auto;">
        <span id="playbackStateBadge" class="status-badge stopped">ОСТАНОВЛЕНО</span>
      </div>
    </div>

    <!-- Mode Selector & Loop Boundary Strip -->
    <div class="mode-strip">
      <div class="mode-selector">
        <span class="mode-label">РЕЖИМ СИНХРОНИЗАЦИИ:</span>
        <button id="btnModeFreeRun" class="btn-mode active" title="Без вмешательства во время видео (1.0x), авто-рестарт на границе каждого цикла">
          <span class="mode-icon">🔄</span>
          <span>Режим 1: Свободный ход (Авто-рестарт лупа)</span>
        </button>
        <button id="btnModeActiveSync" class="btn-mode" title="Непрерывный контроль времени и плавная микро-подстройка скорости">
          <span class="mode-icon">⚡</span>
          <span>Режим 2: Активная синхронизация</span>
        </button>
      </div>

      <div class="cycle-info-box">
        <span class="cycle-item">Цикл: <strong id="lblCycleIndex">#1</strong></span>
        <span class="cycle-item">До авто-рестарта: <strong id="lblLoopRemaining">—</strong></span>
      </div>

      <div class="mode-actions">
        <button id="btnRetrigger" class="btn-cmd btn-retrigger" title="Мгновенный синхронный перезапуск всех iPad с 00:00.000">
          🔁 СИНХРОННЫЙ РЕСТАРТ СЕЙЧАС
        </button>
      </div>
    </div>

    <!-- Master Controls Strip -->
    <div class="controls-strip">
      <div class="playback-buttons">
        <button id="btnMasterPlay" class="btn-cmd btn-play">▶ СТАРТ ВСЕХ</button>
        <button id="btnMasterPause" class="btn-cmd btn-pause">⏸ ПАУЗА</button>
        <button id="btnMasterStop" class="btn-cmd btn-stop">⏹ СТОП</button>
        <button id="btnMasterRewind" class="btn-cmd">⏮ В НАЧАЛО</button>
      </div>

      <!-- Timeline Scrubber -->
      <div class="timeline-box">
        <span id="lblCurrentTime" class="timeline-timecode">00:00:00.000</span>
        <input type="range" id="masterTimeline" class="timeline-slider" min="0" max="100" step="0.1" value="0">
        <span id="lblTotalDuration" class="timeline-timecode">00:00:00.000</span>
      </div>

      <!-- Quick Tool Buttons -->
      <div class="tool-buttons">
        <button id="btnToggleLoop" class="btn-cmd active" title="Автоматический повтор (Loop)">🔁 Зациклить</button>
        <button id="btnIdentifyAll" class="btn-cmd" title="Подсветить номера на всех 42 iPad">💡 Мигнуть номерами</button>
        <button id="btnCheckArm" class="btn-cmd" title="Проверить готовность всех планшетов">⚡ Запрос Armed</button>
        <button id="btnToggleBlackout" class="btn-cmd" title="Затемнить экраны (Blackout)">🕶 Блэкаут</button>
        <button id="btnReloadAll" class="btn-cmd" title="Перезагрузить веб-страницы на всех iPad">🔄 Перезагрузить все</button>
      </div>
    </div>
  </header>

  <!-- 42 Device Cards Grid -->
  <main class="grid-container">
    <div id="deviceGrid" class="device-grid">
      <!-- 42 slots populated dynamically -->
    </div>
  </main>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
